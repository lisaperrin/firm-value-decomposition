[project]
name = "firmvalue"
version = "0.1.0"
description = "Structural decomposition of firm value into physical capital, labor, knowledge capital and brand capital"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Lisa Perrin" }]
keywords = ["corporate finance", "intangible capital", "tobin's q", "structural estimation", "mcp", "claude-code"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "typer>=0.12",
    "mcp>=2.0",
]

[project.scripts]
firmvalue = "firmvalue.cli:app"
firmvalue-mcp = "firmvalue.mcp_server:main"

[project.urls]
Repository = "https://github.com/lisaperrin/firm-value-decomposition"

[project.optional-dependencies]
live = [
    "marketlens",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "PT", "D"]
ignore = ["D100", "D104", "D105", "D107", "D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["matplotlib.*", "scipy.*"]
ignore_missing_imports = true

# The live extra is optional and private, so environments without it (CI among them)
# must still type-check; with the extra installed mypy reads MarketLens' own types.
[[tool.mypy.overrides]]
module = ["marketlens.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["firmvalue"]
branch = true

[tool.uv.sources]
marketlens = { git = "https://github.com/lisaperrin/marketlens", tag = "v0.3.1" }
